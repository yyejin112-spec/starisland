<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>별빛섬 키우기</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #bec6e4;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		
#status-hint {
	position: absolute;
	left: 0;
	right: 0;
	top: max(1rem, env(safe-area-inset-top));
	margin: 0 auto;
	width: min(88%, 26rem);
	display: none;
	color: #2e3350;
	background-color: rgba(255, 255, 255, 0.72);
	border-radius: 0.6rem;
	padding: 0.7rem 0.9rem;
	font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
	font-size: 0.95rem;
	line-height: 1.5;
	text-align: center;
	word-break: keep-all;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="별빛섬">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#bec6e4">
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--false use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-hint">처음 열 때는 준비하는 데 <b>30초~1분</b>쯤 걸려요.<br>화면이 멈춘 것 같아도 창을 닫지 말고 기다려 주세요.<br>「페이지 응답 없음」 창이 뜨면 <b>기다리기</b>를 눌러 주세요.<br><small>한 번 열고 나면 다음부터는 금방 열려요.</small></div>
			<script>
(function () {
	// WebGL 이 Direct3D 로 그려지는지 (윈도우의 ANGLE) — 알 수 없으면 윈도우인지로 판단
	let d3d = /Windows/.test(navigator.userAgent);
	try {
		const gl = document.createElement('canvas').getContext('webgl2');
		if (gl) {
			const ext = gl.getExtension('WEBGL_debug_renderer_info');
			const r = String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER) || '');
			if (/Direct3D|D3D/i.test(r)) {
				d3d = true;
			} else if (/OpenGL|Vulkan|Metal|Apple|Mali|Adreno|PowerVR/i.test(r)) {
				d3d = false;
			}
			const lose = gl.getExtension('WEBGL_lose_context');
			if (lose) {
				lose.loseContext();
			}
		}
	} catch (e) { /* 모르면 위 판단 그대로 */ }
	if (d3d) {
		document.getElementById('status-hint').style.display = 'block';
	}
}());
			</script>
			<div id="status-notice"></div>
		</div>

		<script>
(function () {
	// 거를지는 '프레임'마다 정한다 (같은 프레임의 콜백은 시각 t 가 같다) — 콜백마다 번갈아 정하면
	// 한 프레임에 콜백이 여럿일 때 엔진 콜백만 계속 걸러져 게임이 멈춘다.
	// 지난번 돌린 프레임에서 30ms 가 안 지났을 때만 거른다 → 원래 30fps 가 안 나오는 느린 기기는 기다림이 늘지 않고,
	// 120Hz 화면도 30fps 로 맞는다
	const raf = window.requestAnimationFrame.bind(window);
	let curT = -1;
	let lastRun = -1e9;
	let skip = false;
	window.__fpsHalf = false;
	window.requestAnimationFrame = function (cb) {
		return raf(function (t) {
			if (t !== curT) {
				curT = t;
				skip = window.__fpsHalf && t - lastRun < 30;
				if (!skip) {
					lastRun = t;
				}
			}
			if (skip) {
				window.requestAnimationFrame(cb);
				return;
			}
			cb(t);
		});
	};
}());
		</script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":14071320,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
